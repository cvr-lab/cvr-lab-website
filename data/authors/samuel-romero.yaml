bio: After earning my degree in 1998 and gaining professional experience in industry, I worked as a research fellow at the National Institute for Aerospace Technology (INTA, Torrejón de Ardoz) on a project related to embedded systems for the International Space Station. Since 2002, already at the University of Granada, I have participated continuously in competitively funded research projects, either as a member of the research team or as principal investigator (at the local, regional, national and European levels). I have also led several technology transfer projects for public administrations (Ministry of Defence) and private entities. I have served as a reviewer for major conferences (IWANN) and for high-impact journals from well-known publishers (Elsevier, IEEE). For several years, I have also been working as an evaluator and as a reviewer of evaluators for European Commission proposals. Since 2002, I have been a member of the CASIP (Circuits and Systems for Information Processing) research group at the University of Granada. My research career has focused mainly on the development of bio-inspired systems for biomedical engineering applications (bio-inspired vision), and on the development of customised applications in the field of unmanned aircraft systems (UAS). My scientific publications centre on the former, as the latter is subject to confidentiality and security restrictions (6 contracts and projects with the Ministry of Defence or with companies, 4 of them as PI).
