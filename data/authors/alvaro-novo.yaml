bio: Álvaro Novo was born in Granada, Spain, in 1997. He obtained his B.Sc. degree in Industrial Electronics Engineering from the University of Granada (UGR), Granada, Spain, in 2019. In 2020, he received his M.Sc. degree in Automation and Robotics from the Polytechnic University of Madrid (UPM), Madrid, Spain. He received his Ph.D. in autonomous robotics in 2026 from the UGR. During the Ph.D. studies, he was a Visiting Researcher with the University of Maryland (UMD), College Park, MD, USA. He is currently a Postdoctoral Researcher with the Department of Computer Engineering, Automation and Robotics (ICAR), UGR. His main research interests include guidance-navigation-control policies, computer vision, and bio-inspired solutions applied to Unmanned Aerial Vehicles (UAVs) using different technologies, including neuromorphic sensors.
